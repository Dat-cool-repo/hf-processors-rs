name: Wheels

# Builds abi3 (CPython >= 3.9) wheels for the `hf_processors_rs` Python package and tests each
# one against the golden fixtures. On a `v*` tag, once every build and test job has passed, the
# `publish` job uploads the wheels and the sdist to PyPI with trusted publishing (OIDC, no token).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { name: linux-aarch64, runner: ubuntu-latest, target: aarch64, manylinux: "2_28" }
          - { name: windows-x64, runner: windows-latest, target: x64, manylinux: "" }
          - { name: macos-x86_64, runner: macos-15-intel, target: x86_64, manylinux: "" }
          - { name: macos-arm64, runner: macos-14, target: aarch64, manylinux: "" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          args: --release --out dist
      - name: License files and metadata in the wheel
        shell: bash
        run: python scripts/check_dist.py bindings/python/dist/*.whl
      - uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.platform.name }}
          path: bindings/python/dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check the sdist (license files, twine), then build and test from it in a fresh venv
        run: |
          python scripts/check_dist.py bindings/python/dist/*.tar.gz
          python -m pip install twine
          python -m twine check --strict bindings/python/dist/*.tar.gz
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip install bindings/python/dist/*.tar.gz pytest pillow
          cd bindings/python && /tmp/sdist-venv/bin/python -m pytest -q tests
      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: bindings/python/dist/*.tar.gz

  test:
    name: test ${{ matrix.platform.name }} / py${{ matrix.python }}
    needs: build
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
        platform:
          - { name: linux-x86_64, runner: ubuntu-latest }
          - { name: windows-x64, runner: windows-latest }
          - { name: macos-x86_64, runner: macos-15-intel }
          - { name: macos-arm64, runner: macos-14 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v7
        with:
          name: wheel-${{ matrix.platform.name }}
          path: dist
      - name: Install wheel + test deps
        shell: bash
        run: |
          python -m pip install pytest numpy pillow
          python -m pip install --no-index --find-links dist hf-processors-rs
      - name: Golden-fixture parity
        working-directory: bindings/python
        run: python -m pytest -q tests

  publish:
    name: Publish to PyPI
    needs: [build, sdist, test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hf-processors-rs
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          path: dist
      - name: Tag matches the package version
        run: |
          v="${GITHUB_REF_NAME#v}"
          ls -la dist
          for f in dist/*; do
            case "$(basename "$f")" in
              *-"$v"-*|*-"$v".tar.gz) ;;
              *) echo "::error::$f does not match tag version $v"; exit 1 ;;
            esac
          done
      - uses: pypa/gh-action-pypi-publish@release/v1
