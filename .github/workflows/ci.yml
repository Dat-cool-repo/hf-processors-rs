name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Golden tests run against the committed fixtures (golden/manifest*.json, golden/fixtures):
      # bit-exact image processors (both transformers backends), Qwen2-VL, Whisper.
      - name: Test (pure Rust; JPEG within +-3 of Pillow)
        run: cargo test --release -- --nocapture
      - name: "Test (pil-jpeg: libjpeg-turbo decoder, Pillow-identical JPEG)"
        run: cargo test --release --features pil-jpeg,rayon -- --nocapture
      - name: Minimal / optional feature builds
        run: |
          cargo check --no-default-features
          cargo check --no-default-features --features decode
          cargo check --features candle

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features pil-jpeg,rayon -- -D warnings
      - name: clippy (default features, pure-Rust JPEG path)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: License files shipped in the Python distributions are up to date
        run: |
          for f in LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md; do
            cmp "$f" "bindings/python/licenses/$f"
          done
          python3 scripts/rust_dep_licenses.py | diff -u bindings/python/licenses/rust-dependencies.txt -

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Core for wasm32 (no hub / rayon / pil-jpeg)
        run: cargo build --release --target wasm32-unknown-unknown --no-default-features --features decode
      - name: wasm-bindgen package
        run: |
          cargo build --release --target wasm32-unknown-unknown --manifest-path bindings/wasm/Cargo.toml
          ls -la target/wasm32-unknown-unknown/release/*.wasm
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Run the wasm module in Node.js, bit-exact vs native
        run: |
          wasm-pack build bindings/wasm --target nodejs --out-dir pkg-node
          imgs="golden/images/coffee.png golden/images/rgba_257x129.png golden/images/palette_200x120.png golden/images/gray16_160x120.png golden/images/photo_500x375.jpg golden/images/cmyk_200x150.jpg"
          cargo run --release -p hf-processors-wasm --example native_reference -- "$RUNNER_TEMP/ref" golden $imgs
          node bindings/wasm/tests/node_check.mjs bindings/wasm/pkg-node "$RUNNER_TEMP/ref" golden $imgs

  fuzz:
    # Replays the committed regression inputs and fuzzes each target briefly (the long runs are
    # local; see fuzz/run.sh and the README's Testing section).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Build the fuzz targets
        run: cd fuzz && cargo fuzz build --target x86_64-unknown-linux-gnu
      - name: Regressions + 30 s per target
        run: |
          for t in config decode_pure decode_libjpeg resize smart_resize whisper; do
            echo "::group::$t"
            bash fuzz/run.sh "$t" 30
            echo "::endgroup::"
          done

  python:
    name: Python bindings (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and install the wheel
        shell: bash
        run: |
          python -m pip install maturin pytest numpy pillow
          cd bindings/python
          maturin build --release --out dist
          python -m pip install --no-index --find-links dist hf-processors-rs
      - name: Parity with the golden fixtures (no transformers needed)
        working-directory: bindings/python
        run: python -m pytest -q tests

  python-vs-transformers:
    # Live comparison with the pinned reference stack (CPU torch).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install the reference stack
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1 torchvision==0.29.1
          python -m pip install transformers==5.18.0 pillow==12.3.0 numpy==2.5.3 maturin pytest
      - name: Build and install the wheel
        run: |
          cd bindings/python
          maturin build --release --out dist
          python -m pip install --no-index --find-links dist hf-processors-rs
      - name: pytest (fixtures + live transformers parity)
        working-directory: bindings/python
        run: python -m pytest -q tests
