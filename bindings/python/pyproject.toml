[build-system]
# 1.10: complete PEP 639 support (license expression + license-files in wheels and sdists).
requires = ["maturin>=1.10,<2"]
build-backend = "maturin"

[project]
name = "hf-processors-rs"
version = "0.1.0"
description = "Hugging Face transformers image/audio preprocessors (CLIP, SigLIP, ViT, ConvNeXt, BLIP, Qwen2-VL, Whisper) reproduced bit-exactly in Rust"
readme = "README.md"
# Our code. The compiled extension also contains libjpeg-turbo (IJG AND BSD-3-Clause) and
# permissively licensed Rust crates; their notices are in the license files below.
license = "MIT OR Apache-2.0"
# Copies of the repository root files (CI checks they are identical); in licenses/ because the
# sdist also carries the root crate, whose LICENSE-* files land at the sdist root.
license-files = ["licenses/*"]
authors = [{ name = "Dat-cool-repo contributors" }]
keywords = ["huggingface", "transformers", "preprocessing", "clip", "siglip", "qwen2-vl", "whisper"]
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.urls]
Homepage = "https://github.com/Dat-cool-repo/hf-processors-rs"
Repository = "https://github.com/Dat-cool-repo/hf-processors-rs"
Issues = "https://github.com/Dat-cool-repo/hf-processors-rs/issues"

[project.optional-dependencies]
pil = ["pillow"]
test = ["pytest", "pillow"]

[tool.maturin]
python-source = "python"
module-name = "hf_processors_rs._hf_processors_rs"
strip = true
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
